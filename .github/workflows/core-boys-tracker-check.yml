name: Core Boys Tracker Check
# keep required check context available for protection validation flows

on:
  push:
    paths:
      - "apps/core-boys-tracker/**"
      - ".github/workflows/core-boys-tracker-check.yml"
  pull_request:
    paths:
      - "apps/core-boys-tracker/**"
      - ".github/workflows/core-boys-tracker-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core-boys-tracker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/core-boys-tracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

